<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VocabBD — 130 Days Vocabulary</title>
<meta name="description" content="A searchable 130-day English vocabulary reader built from the supplied VocabBD PDFs." />
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--brand:#16a34a;--brand2:#0f7a36;--chip:#ecfdf3;--shadow:0 12px 30px rgba(16,24,40,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{max-width:1400px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:16px}.logo{font-weight:900;font-size:20px;letter-spacing:-.5px}.logo span{color:var(--brand)}
.search{flex:1;max-width:620px;position:relative}.search input{width:100%;padding:13px 16px 13px 42px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px;outline:none}.search input:focus{border-color:#86efac;box-shadow:0 0 0 4px #dcfce7}.search svg{position:absolute;left:14px;top:13px;color:#98a2b3}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:700}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.layout{max-width:1400px;margin:auto;padding:22px 20px;display:grid;grid-template-columns:280px 1fr;gap:22px}.sidebar{position:sticky;top:86px;height:calc(100vh - 108px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.side-title{font-weight:800;margin:4px 6px 12px}.days{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.day{padding:8px 4px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700}.day:hover,.day.active{background:var(--chip);border-color:#86efac;color:var(--brand2)}
main{min-width:0}.hero{background:linear-gradient(135deg,#063b20,#16a34a);color:#fff;border-radius:20px;padding:28px;box-shadow:var(--shadow);margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:clamp(28px,4vw,46px);letter-spacing:-1px}.hero p{margin:0;color:#dcfce7;max-width:760px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.stat{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);padding:9px 12px;border-radius:10px;font-size:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0}.title{font-size:21px;font-weight:850}.muted{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 5px 18px rgba(16,24,40,.04);transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.word{font-size:22px;font-weight:850;margin-bottom:4px}.pos{display:inline-block;font-size:11px;font-weight:800;color:var(--brand2);background:var(--chip);padding:4px 7px;border-radius:999px}.num{float:right;color:#98a2b3;font-size:12px}.open{margin-top:15px;width:100%}.empty{text-align:center;padding:55px 20px;background:#fff;border:1px dashed #cfd4dc;border-radius:16px;color:var(--muted)}
.reader{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.reader-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.reader iframe{width:100%;height:720px;border:0;display:block}.hidden{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:relative;top:0;height:auto}.days{grid-template-columns:repeat(8,1fr)}}
@media(max-width:600px){.nav{flex-wrap:wrap}.search{order:3;flex-basis:100%}.days{grid-template-columns:repeat(6,1fr)}.layout{padding:14px}.hero{padding:22px}.reader iframe{height:560px}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">Vocab<span>BD</span></div><div class="search"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" placeholder="Search a word, e.g. Abound, Acumen..." autocomplete="off"></div><button class="btn" id="theme">Dark</button></div></header>
<div class="layout">
<aside class="sidebar"><div class="side-title">130 Days</div><div class="days" id="days"></div></aside>
<main>
<section class="hero"><h1>130 Days Vocabulary</h1><p>Search, browse and open the original vocabulary PDFs from your collection. Designed for daily English vocabulary practice.</p><div class="stats"><div class="stat"><b>130</b> Days</div><div class="stat"><b id="wordCount">0</b> Indexed words</div><div class="stat">Searchable</div><div class="stat">PDF Reader</div></div></section>
<div class="toolbar"><div><div class="title" id="sectionTitle">Day 1</div><div class="muted" id="resultInfo"></div></div><button class="btn primary" id="openDay">Open PDF</button></div>
<div class="cards" id="cards"></div>
<div class="reader hidden" id="reader"><div class="reader-head"><b id="readerTitle">PDF Reader</b><button class="btn" id="closeReader">Close</button></div><iframe id="pdfFrame" title="Vocabulary PDF"></iframe></div>
</main></div>
<script src="data.js"></script>
<script>
const DATA=window.VOCAB_DATA||[];let currentDay=1;let query='';
const $=id=>document.getElementById(id);const total=DATA.reduce((a,d)=>a+d.words.length,0);$('wordCount').textContent=total.toLocaleString();
function renderDays(){ $('days').innerHTML=DATA.map(d=>`<button class="day ${d.day===currentDay?'active':''}" onclick="selectDay(${d.day})">${d.day}</button>`).join(''); }
function selectDay(day){currentDay=day;renderDays();renderCards();window.scrollTo({top:0,behavior:'smooth'});}
function renderCards(){const d=DATA.find(x=>x.day===currentDay);let words=d?.words||[];const q=query.trim().toLowerCase();if(q) words=words.filter(x=>x.word.toLowerCase().includes(q)||x.pos.toLowerCase().includes(q));$('sectionTitle').textContent=q?`Search: ${query}`:`Day ${currentDay}`;$('resultInfo').textContent=`${words.length} word${words.length===1?'':'s'} shown`;$('cards').innerHTML=words.length?words.map(x=>`<article class="card"><span class="num">#${x.n}</span><div class="word">${esc(x.word)}</div><span class="pos">${esc(x.pos)}</span><button class="btn open" onclick="openPDF(${d.day})">Read Day ${d.day} PDF</button></article>`).join(''):`<div class="empty" style="grid-column:1/-1">No matching words found in this day.</div>`;}
function openPDF(day){const d=DATA.find(x=>x.day===day);if(!d)return;const path='pdfs/'+encodeURIComponent(d.pdf);$('pdfFrame').src=path;$('readerTitle').textContent=`Day ${day} — ${d.pdf}`;$('reader').classList.remove('hidden');$('openDay').textContent='PDF Opened';$('reader').scrollIntoView({behavior:'smooth',block:'start'});}
$('openDay').onclick=()=>openPDF(currentDay);$('closeReader').onclick=()=>{$('reader').classList.add('hidden');$('pdfFrame').src='';};$('search').addEventListener('input',e=>{query=e.target.value;renderCards();});
$('theme').onclick=()=>{document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');document.documentElement.style.setProperty('--bg',dark?'#0b1110':'#f5f7fb');document.documentElement.style.setProperty('--panel',dark?'#101817':'#fff');document.documentElement.style.setProperty('--text',dark?'#f2f4f7':'#101828');document.documentElement.style.setProperty('--muted',dark?'#98a2b3':'#667085');document.documentElement.style.setProperty('--line',dark?'#26332f':'#e4e7ec');$('theme').textContent=dark?'Light':'Dark';};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
renderDays();renderCards();
</script>
</body></html>
